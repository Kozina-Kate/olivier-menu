services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olivier}
      POSTGRES_USER: ${POSTGRES_USER:-olivier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olivier-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olivier} -d ${POSTGRES_DB:-olivier}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
